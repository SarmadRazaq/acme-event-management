# nginx config for the production frontend container.
#  - serves the built React app (single-page app fallback to index.html)
#  - reverse-proxies /api/* to the FastAPI backend, so browser and API share one origin

upstream backend {
    server backend:8000;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Container health check (does not touch the backend).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API: strip the /api prefix and forward to FastAPI.
    location /api/ {
        proxy_pass http://backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Note: `expires` is used instead of `add_header Cache-Control` because any add_header
    # inside a location would discard the security headers declared above.

    # Fingerprinted build assets never change, so let browsers cache them for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Every other path is a client-side route: serve index.html (always revalidated).
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
